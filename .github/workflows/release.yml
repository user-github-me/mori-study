name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify version matches the release tag
        run: node -e 'const p=require("./packages/mori/package.json"); if(process.env.RELEASE_TAG!==`v${p.version}`) throw new Error("Release tag and package version must match")'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - name: Build the distributable package
        run: node scripts/package.mjs pack
      - name: Create checksums
        run: (cd packages/mori && sha256sum *.tgz) > SHA256SUMS.txt
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packages/mori/*.tgz SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" packages/mori/*.tgz SHA256SUMS.txt --verify-tag --title "Mori Study $RELEASE_TAG" --generate-notes
          fi

  npm:
    needs: release
    if: vars.MORI_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: node scripts/package.mjs pack
      - name: Publish through npm trusted publishing
        run: npm publish packages/mori/*.tgz --access public --provenance

  github-packages:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/github-packages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
