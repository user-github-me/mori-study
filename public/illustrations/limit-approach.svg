<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">The square function approaches four as x approaches two</title><desc id="desc">A zoomed graph of f(x)=x squared around x=2, with a point at (2,4). Inputs approach two from both sides. The sample pairs are (1.9,3.61), (1.99,3.9601), and (2.01,4.0401); all plotted coordinates follow the same exact transform.</desc>
