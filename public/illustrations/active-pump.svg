<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">An ATP-powered pump moves an ion against its electrochemical gradient</title><desc id="desc">A schematic membrane pump uses ATP energy to move ions from the lower-concentration side to the higher-concentration side in this illustrative example of active transport. An energy input distinguishes this pump from a passive channel.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#283f35}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#748576}.heading{font-size:29px;font-weight:700;letter-spacing:-.6px}.label{font-size:23px;font-weight:600}.small{font-size:19px;fill:#6b7a6f}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ion-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#8b74a6" stroke-width="1.6"/></marker><marker id="energy-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b59062" stroke-width="1.6"/></marker></defs><rect width="800" height="600" rx="28" fill="#fbfaf6"/><rect x="1" y="1" width="798" height="598" rx="27" fill="none" stroke="#e7e8df"/>
<text x="48" y="42" class="eyebrow">ACTIVE TRANSPORT · ENERGY MAKES THE DIFFERENCE</text><text x="48" y="84" class="heading">Moving against a gradient takes energy.</text>
