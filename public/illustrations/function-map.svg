<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">A function sends each input to one output</title><desc id="desc">The function f of x equals x squared maps negative two and positive two to four, and zero to zero. Different inputs may share one output.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#283f35}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#748576}.heading{font-size:29px;font-weight:700;letter-spacing:-.6px}.label{font-size:23px;font-weight:600}.small{font-size:19px;fill:#6b7a6f}.number{font-size:34px;font-weight:600}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="sage-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#648567" stroke-width="1.7"/></marker><marker id="clay-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#bb876d" stroke-width="1.7"/></marker><marker id="violet-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#9185ad" stroke-width="1.7"/></marker></defs><rect width="800" height="600" rx="28" fill="#fbfaf6"/><rect x="1" y="1" width="798" height="598" rx="27" fill="none" stroke="#e7e8df"/>

<text x="48" y="42" class="eyebrow">FUNCTIONS · THE BIG IDEA</text>
<text x="48" y="84" class="heading">One input. One output.</text>
<rect x="310" y="112" width="180" height="58" rx="29" fill="#e7ede1"/><text x="400" y="150" class="label" text-anchor="middle">f(x) = x²</text>
<text x="173" y="172" class="small" text-anchor="middle">Input x</text><text x="626" y="217" class="small" text-anchor="middle">Output f(x)</text>
<g class="line" stroke-width="4">
<path d="M 246 227 C 377 227 417 281 554 281" stroke="#648567" marker-end="url(#sage-arrow)"/>
<path d="M 246 333 C 377 333 417 281 554 281" stroke="#bb876d" marker-end="url(#clay-arrow)"/>
<path d="M 246 440 L 554 440" stroke="#9185ad" marker-end="url(#violet-arrow)"/>
</g>
<g fill="#fff" stroke="#dce3d7" stroke-width="2"><rect x="108" y="191" width="132" height="72" rx="20"/><rect x="108" y="297" width="132" height="72" rx="20"/><rect x="108" y="404" width="132" height="72" rx="20"/></g>
<text x="174" y="239" class="number" text-anchor="middle">−2</text><text x="174" y="345" class="number" text-anchor="middle">2</text><text x="174" y="452" class="number" text-anchor="middle">0</text>
<rect x="562" y="245" width="132" height="72" rx="20" fill="#e7ede1" stroke="#cfdbc9" stroke-width="2"/><rect x="562" y="404" width="132" height="72" rx="20" fill="#ede9f2" stroke="#dad2e7" stroke-width="2"/>
<text x="628" y="293" class="number" text-anchor="middle">4</text><text x="628" y="452" class="number" text-anchor="middle">0</text>
<rect x="48" y="516" width="704" height="48" rx="15" fill="#f0f1e9"/><text x="400" y="547" class="label" text-anchor="middle">Different inputs can share an answer.</text>

</svg>
