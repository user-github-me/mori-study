<title id="title">A simplified photosynthetic plant cell</title><desc id="desc">A schematic plant cell shows a supporting outer cell wall, an inner plasma membrane, a nucleus, a large central vacuole, a chloroplast, and a mitochondrion. The drawing is a simplified organizational diagram, not a microscopic scale drawing.</desc>
