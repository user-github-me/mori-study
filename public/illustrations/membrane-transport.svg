<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Passive movement through a plasma membrane</title><desc id="desc">A phospholipid bilayer is drawn with water-facing heads and inward-facing tails. Small nonpolar oxygen molecules diffuse directly across the bilayer; an ion moves through a protein channel. Both illustrated movements are down their relevant gradients and passive.</desc>
