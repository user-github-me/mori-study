<text x="224" y="463" class="label" text-anchor="middle">Water in · can swell</text><text x="584" y="433" class="label" text-anchor="middle">Water out · can shrink</text>
<circle cx="57" cy="527" r="5.5" fill="#a08eaf"/><text x="72" y="534" class="small">Solute</text><path d="M194 527H227" stroke="#588d82" stroke-width="3" marker-end="url(#water-arrow)"/><text x="243" y="534" class="small">Net water movement</text>
<text x="48" y="569" class="small">Equal pressure; the relevant solutes cannot cross.</text>
