<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">Net water movement can make cells swell or shrink</title><desc id="desc">Two schematic cells compare water movement when the surrounding solution is hypotonic or hypertonic. With equal pressure and relevant solutes unable to cross the membrane, water enters a cell from lower effective solute concentration outside, and leaves a cell when the outside concentration is higher.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#283f35}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#748576}.heading{font-size:29px;font-weight:700;letter-spacing:-.6px}.label{font-size:23px;font-weight:600}.small{font-size:19px;fill:#6b7a6f}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="water-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#588d82" stroke-width="1.6"/></marker></defs><rect width="800" height="600" rx="28" fill="#fbfaf6"/><rect x="1" y="1" width="798" height="598" rx="27" fill="none" stroke="#e7e8df"/>
<text x="48" y="42" class="eyebrow">OSMOSIS · FOLLOW THE WATER</text><text x="48" y="84" class="heading">The surroundings change the direction.</text>
<rect x="48" y="129" width="340" height="360" rx="23" fill="#eff3e9"/><rect x="412" y="129" width="340" height="360" rx="23" fill="#f1edf4"/>
<text x="218" y="164" class="label" text-anchor="middle">Lower solute outside</text><text x="582" y="164" class="label" text-anchor="middle">Higher solute outside</text>
<circle cx="224" cy="329" r="100" fill="#dfeceb" stroke="#93b8ae" stroke-width="3"/><circle cx="584" cy="329" r="73" fill="#dfeceb" stroke="#93b8ae" stroke-width="3"/>
<circle cx="130" cy="204" r="5.5" fill="#a08eaf"/><circle cx="331" cy="229" r="5.5" fill="#a08eaf"/><circle cx="102" cy="392" r="5.5" fill="#a08eaf"/><circle cx="212" cy="277" r="5.5" fill="#a08eaf"/><circle cx="246" cy="288" r="5.5" fill="#a08eaf"/><circle cx="177" cy="327" r="5.5" fill="#a08eaf"/><circle cx="230" cy="331" r="5.5" fill="#a08eaf"/><circle cx="267" cy="349" r="5.5" fill="#a08eaf"/><circle cx="206" cy="373" r="5.5" fill="#a08eaf"/><circle cx="258" cy="389" r="5.5" fill="#a08eaf"/><circle cx="594" cy="299" r="5.5" fill="#a08eaf"/><circle cx="563" cy="323" r="5.5" fill="#a08eaf"/><circle cx="603" cy="343" r="5.5" fill="#a08eaf"/><circle cx="554" cy="350" r="5.5" fill="#a08eaf"/><circle cx="473" cy="202" r="5.5" fill="#a08eaf"/><circle cx="529" cy="187" r="5.5" fill="#a08eaf"/><circle cx="602" cy="192" r="5.5" fill="#a08eaf"/><circle cx="684" cy="207" r="5.5" fill="#a08eaf"/><circle cx="710" cy="256" r="5.5" fill="#a08eaf"/><circle cx="694" cy="339" r="5.5" fill="#a08eaf"/><circle cx="710" cy="419" r="5.5" fill="#a08eaf"/><circle cx="644" cy="455" r="5.5" fill="#a08eaf"/><circle cx="584" cy="463" r="5.5" fill="#a08eaf"/><circle cx="512" cy="450" r="5.5" fill="#a08eaf"/><circle cx="452" cy="404" r="5.5" fill="#a08eaf"/><circle cx="455" cy="306" r="5.5" fill="#a08eaf"/><circle cx="476" cy="259" r="5.5" fill="#a08eaf"/><circle cx="517" cy="213" r="5.5" fill="#a08eaf"/>
